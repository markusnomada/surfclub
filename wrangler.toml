name = "surfclub"
compatibility_date = "2025-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "surfclub"
database_id = "ccc8f5ae-7241-4a23-9d54-94d69fe0bccf"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "surfclub-videos"

[vars]
# Cloudflare Access (Zero Trust). Se completan al crear la aplicación de Access.
# Mientras estén vacías, la API rechaza todo (salvo DEV_USER en desarrollo local).
ACCESS_TEAM_DOMAIN = ""   # ej. "markusnomada.cloudflareaccess.com"
ACCESS_AUD = ""           # "Application Audience (AUD) Tag" de la app en Access
